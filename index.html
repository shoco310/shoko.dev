<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics is loaded from src/analytics.ts so it can be kept
         off the citizen submission page (#/voice). -->

    <title>さとうしょうこ | 誰もが挑戦できる宇部へ</title>

    <meta name="description" content="宇部から新しい挑戦を。さとうしょうこ公式サイト。教育・人材育成、仕事・産業振興、女性・子育て支援、市民参加・行政改革に取り組みます。" />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="さとうしょうこ | 誰もが挑戦できる宇部へ" />
    <meta property="og:description" content="宇部から新しい挑戦を。教育・人材育成、仕事・産業振興、女性・子育て支援、市民参加・行政改革に取り組みます。" />
    <meta property="og:url" content="https://shoko.dev/" />
    <meta property="og:site_name" content="さとうしょうこ" />
    <meta property="og:image" content="https://shoko.dev/images/ogp-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="誰もが挑戦できる宇部へ。さとうしょうこ" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="さとうしょうこ | 誰もが挑戦できる宇部へ" />
    <meta name="twitter:description" content="宇部から新しい挑戦を。教育・人材育成、仕事・産業振興、女性・子育て支援、市民参加・行政改革。" />
    <meta name="twitter:image" content="https://shoko.dev/images/ogp-v2.jpg" />
    <meta name="twitter:image:alt" content="誰もが挑戦できる宇部へ。さとうしょうこ" />

    <!-- Fonts: Noto Sans JP (Japanese) and Inter (Latin and numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- LCP image (used as a CSS background-image on .hero__media).
         styles.css swaps to hero-main-1000.jpg at max-width: 860px, so the
         media conditions here must match that breakpoint. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-main.jpg"
      media="(min-width: 861px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/hero-main-1000.jpg"
      media="(max-width: 860px)"
      fetchpriority="high"
    />

    <meta name="theme-color" content="#e83e8c" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
